services:
  postgres:
    image: postgres:16-alpine
    container_name: outreach-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: outreach
      POSTGRES_PASSWORD: outreach
      POSTGRES_DB: outreach
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U outreach -d outreach']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: outreach-redis
    restart: unless-stopped
    # AOF keeps queued jobs across a restart — without it a crash loses
    # in-flight sends, and a re-run would risk duplicate delivery.
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    container_name: outreach-api
    restart: unless-stopped
    command: node dist/server.js
    env_file: .env
    environment:
      DATABASE_URL: postgresql://outreach:outreach@postgres:5432/outreach
      REDIS_URL: redis://redis:6379
    ports:
      - '${PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles: ['app']

  worker:
    build: .
    container_name: outreach-worker
    restart: unless-stopped
    command: node dist/workers/email.worker.js
    env_file: .env
    environment:
      DATABASE_URL: postgresql://outreach:outreach@postgres:5432/outreach
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles: ['app']

volumes:
  postgres_data:
  redis_data:
